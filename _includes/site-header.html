<nav class="hidden lg:block absolute top-0 right-0 w-full z-50">
    <div class="flex justify-between items-center px-6 py-4 border-b border-{{ page.nav.color }}">
        <a href="/">
            <img src="/uploads/icons/manamovement-4.png" alt="Mana Movement" class="w-48 pl-4">
        </a>
        <div class="flex items-center">
            {% for item in site.data.navigation.header %}
            <a href="{{ item.url }}" class="px-3 uppercase text-{{ page.nav.color }} hover:transition hover:duration-500 hover:text-{{ page.nav.color }}">{{ item.title }}</a>
            {% endfor %}
        </div>
    </div>
</nav>

<div class="lg:hidden">
    <div class="mobile-button">
        <span class="mobile-top"></span>
        <span class="mobile-middle"></span>
        <span class="mobile-bottom"></span>
    </div>

    <nav class="mobile-menu">
        {% for item in site.data.navigation.header %}
        <a href="{{ item.url }}" class="px-2 mx-2 {% if forloop.last %}text-feature{% endif %}">{{ item.title }}</a>
        {% endfor %}
    </nav>
</div>
