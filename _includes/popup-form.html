<!-- Click to pop up form: open with any element that has data-popup-open="{{ include.id }}" -->
<div id="popup-{{ include.id }}" class="form-modal hidden fixed inset-0 z-[60] bg-black/80 overflow-auto">
    <div class="form-modal-content absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 max-w-[95vw] max-h-[95vh]">
        <span class="form-modal-close text-[1.5rem] absolute top-4 right-4 z-10 cursor-pointer text-feature font-normal" aria-label="Close">X</span>

        <!-- Form page iframe (loaded on first open) -->
        <iframe data-src="{{ include.src }}" title="{{ include.title }}"
            class="w-[90vw] md:w-[640px] h-[80vh] bg-light border border-main" frameborder="0"></iframe>
    </div>
</div>
